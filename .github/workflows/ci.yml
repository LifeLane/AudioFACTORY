name: CI Quality & Verification

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-verification:
    name: Lint, Test, Security & Full-Stack Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 TypeScript Typecheck & Lint
        run: |
          echo "Running TypeScript strict verification..."
          npm run lint

      - name: 🧪 Execute Unit & Integration Tests
        run: |
          echo "Running test runner suite..."
          npm test

      - name: 🏗️ Full-Stack Production Build
        run: |
          echo "Compiling Vite client SPA and bundling Node.js backend server..."
          npm run build
        env:
          NODE_ENV: production

      - name: 🛡️ Verify Production Artifacts
        run: |
          echo "Checking built web and backend distribution artifacts..."
          test -f dist/index.html || { echo "❌ Error: dist/index.html is missing"; exit 1; }
          test -f dist/server.cjs || { echo "❌ Error: dist/server.cjs is missing"; exit 1; }
          echo "✅ Production artifacts verified successfully."

      - name: 🔒 Security Check - Secret Leak Prevention
        run: |
          echo "Scanning repository to verify no sensitive credentials or keys are tracked in git..."
          LEAK_FOUND=0
          if git ls-files | grep -E '(\.jks|\.keystore|service-account.*\.json|.*firebase-adminsdk.*\.json|\.env$)'; then
            echo "❌ CRITICAL SECURITY ALERT: Sensitive secret/keystore files detected in git index!"
            LEAK_FOUND=1
          fi
          if [ $LEAK_FOUND -ne 0 ]; then
            exit 1
          fi
          echo "✅ No sensitive credentials found in git tracking."

      - name: 🛡️ Security Check - NPM Dependency Audit
        run: |
          echo "Scanning npm dependencies for critical known vulnerabilities..."
          npm audit --audit-level=critical || echo "⚠️ Non-blocking security advisory found in dependencies."
